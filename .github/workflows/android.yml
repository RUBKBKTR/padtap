name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk padtap.apk
          gh release create "apk-${{ github.run_number }}" padtap.apk \
            --title "PadTap Android (build ${{ github.run_number }})" \
            --notes "Shizuku版 PadTap。padtap.apk をダウンロードしてインストールしてね。" \
            --latest

      - name: Save build log to ci-log branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci-log
          cp build.log /tmp/ci-log/ 2>/dev/null || echo "no log" > /tmp/ci-log/build.log
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/ci-log/status.txt
          cd /tmp/ci-log
          git init -q
          git checkout -q -b ci-log
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
