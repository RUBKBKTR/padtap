name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        id: build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../padtap.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator self-test
        id: test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/ci/selftest.sh

      - name: Download Shizuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R RikkaApps/Shizuku --pattern '*.apk' -O shizuku.apk
          ls -l shizuku.apk

      - name: Emulator E2E (Shizuku + overlay)
        id: e2e
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/ci/e2e.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" padtap.apk \
            --title "PadTap Android (build ${{ github.run_number }})" \
            --notes "Shizuku版 PadTap。padtap.apk をダウンロードしてインストールしてね。" \
            --latest

      - name: Upload logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "job=${{ job.status }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }} e2e=${{ steps.e2e.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --latest=false --title "CI logs" --notes "build/test logs"
          for f in status.txt build.log ci-test.log selftest.log probe.log test-status.txt e2e.log e2e-probe.log pad.log shot*.png; do
            [ -s "$f" ] || echo "(empty)" > "$f"
            gh release upload ci-logs "$f" --clobber || true
          done
